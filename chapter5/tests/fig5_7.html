<!DOCTYPE html>
<html>

<head>
    <title>fig5_7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=AM_SVG"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.138.3/three.js"></script>
    <script src="../../js/lib/aframe/NURBSUtils.js"></script>
    <script src="../../js/lib/svg/svg.min.js"></script>
    <script src="../../js/lib/svg/svg.foreignobject.js"></script>
    <script src="../../js/aframe/InsKnots.js"></script>
    <script src="surfaces.js"></script>    
</head>

<body>
    <svg id="drawing"></svg>

    <script>
        var U = [0, 0, 0, 0, 1/4, 1/2, 3/4, 1, 1, 1, 1];
        var P = [
            new THREE.Vector2(40, 120),  //P0
            new THREE.Vector2(100, 120),  //P1
            new THREE.Vector2(130, 60),  //P2
            new THREE.Vector2(180, 30), //P3
            new THREE.Vector2(230, 60),  //P4
            new THREE.Vector2(260, 120),  //P5
            new THREE.Vector2(320, 120)  //P6
        ];

        var draw = SVG(document.getElementById('drawing')).size(400, 340);
        var stroke1 = { width: 1 }, stroke2 = { color: "red" }, stroke3 = { color: "black" }, stroke4 = { color: "blue" };

        var curve = surfaces.CreateCurve(7, 3, U, P);
        var params = surfaces.CreateCurveKnotInsertParams(1/2, 5, 1, 2);
        var ncurve = surfaces.CurveKnotlns(curve, params);
        var ncurve2 = surfaces.DivedeCurve(curve, 1/2);
        //draw.path(NURBSUtils.DrawPath(3, curve.U, curve.points, 0, 1)).fill("none").stroke(stroke2);
        draw.path(NURBSUtils.DrawPath(3, ncurve2.Left.U, ncurve2.Left.points, 0, 0.5)).fill("none").stroke(stroke2);
        draw.path(NURBSUtils.DrawPath(3, ncurve2.Right.U, ncurve2.Right.points, 0.5, 1)).fill("none").stroke(stroke4);

        //var params = surfaces.CreateCurveKnotInsertParams(1/2, 7, 3, 1);
        //var ncurve2 = surfaces.CurveKnotlns(ncurve, params);

        var sstring = "M", C;
        var cc2 = ncurve2.Right;
        for (var i = 0; i < cc2.count; i++) {
            draw.circle(6).move(cc2.points[i].x - 3, cc2.points[i].y - 3).fill('none').stroke(stroke1);
            sstring = sstring.concat(cc2.points[i].x, " ", cc2.points[i].y, " ");
        }

        draw.path(sstring).fill("none").stroke(stroke3);
        //draw.path(NURBSUtils.DrawPath(3, U, P, 0, 1)).fill("none").stroke(stroke3);
        draw.foreignObject(80, 40).move(175, -10).appendChild("p", { innerText: "`C`" });

        var pc = InsKnots.CurvePntByCornerCut(7, 3, U, P, 1/2);
        draw.circle(6).move(pc.x - 3, pc.y - 3).fill('none').stroke(stroke2);

    </script>

</body>

</html>
