<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>test_surf_ins1</title>
  <link rel="stylesheet" href="../../css/a_img.css" />
  <script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=AM_CHTML'></script>
  <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
  <script src="../../js/lib/aframe/aframe-environment-component.min.js"></script>
  <script src="../../js/lib/aframe/aframe-extras.min.js"></script>
  <script src="../../js/lib/aframe/aframe-html-shader.min.js"></script>
  <script src="../../js/lib/aframe/NURBSUtils.js"></script>  
  <!--  -->
  <script src="../../js/aframe/xyz.js"></script>
  <script src="../../js/aframe/InsKnots.js"></script>
  <script src="surfnet.js"></script>  
  <script src="surfaces.js"></script>
</head>

<body>
  <a-scene id="model" background="color: #FFFFFF">
    <a-assets>
      <a-mixin id="plane_material" material="shader: html; ratio: height; transparent: true; side: double; fps: 25"></a-mixin>
    </a-assets>

    <a-light type="point" position="5 5 5"></a-light>
    <a-entity id="cameraRig" position="0 0 0" movement-controls="fly: true">
      <a-camera id="camera" look-controls></a-camera>
      <a-entity vive-controls="hand: left"></a-entity>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>
    
    <a-entity id="sub_model" position="0 1.5 -3.5" rotation="25 -45 -25" axis-xyz>
      <a-text side="double" position="-0.1 0 2.1" rotation="-15 45 0" value="y" color="black"></a-text>
      <a-text side="double" position="0 2 0" rotation="-15 45 0" value="z" color="black"></a-text>
      <a-text side="double" position="2 0 0" rotation="-15 45 0" value="x" color="black"></a-text>
    </a-entity>
  </a-scene>

  <script>
    var P = [[
      new THREE.Vector4(0.3, 1.7, 0, 1),
      new THREE.Vector4(0.7, 1.7, 0, 1), 
      new THREE.Vector4(0.9, 1.2, 0, 1),
      new THREE.Vector4(1.3, 1.2, 0, 1)
    ], [
      new THREE.Vector4(0.3, 1.7, 0.8, 1), 
      new THREE.Vector4(0.7, 1.7, 0.8, 1), 
      new THREE.Vector4(0.9, 1.2, 0.8, 1),
      new THREE.Vector4(1.3, 1.2, 0.8, 1)
    ], [
      new THREE.Vector4(0.3, 1.2, 1.1, 1), 
      new THREE.Vector4(0.7, 1.2, 1.1, 1), 
      new THREE.Vector4(0.9, 0.5, 1.1, 1), 
      new THREE.Vector4(1.3, 0.5, 1.1, 1)
    ],[
      new THREE.Vector4(0.3, 1.2, 1.8, 1), 
      new THREE.Vector4(0.7, 1.2, 1.8, 1), 
      new THREE.Vector4(0.9, 0.5, 1.8, 1),
      new THREE.Vector4(1.3, 0.5, 1.8, 1)
    ]];

    var U = [0, 0, 0, 0, 1, 1, 1, 1];
    var V = [0, 0, 0, 0.5, 1, 1, 1];

    var surf1 = surfaces.CreateSurf(4, 3, U, 4, 2, V, P);
    //var params = surfaces.CreateSurfKnotInsertParams(Direction.U_DIRECTION, 2/5, 3, 0, 2);
    //var params = surfaces.CreateSurfKnotInsertParams('V_DIRECTION', 7/10, 3, 0, 2);
    //var surf = surfaces.SurfaceKnotIns(surf1, params);
    var lr = surfaces.DivedeSurface(surf1, Direction.V_DIRECTION, 7/10);
    var elem = document.getElementById('sub_model');

    var ent2 = document.createElement('a-entity');
    lr.Left['color'] = '#0F0';
    ent2.setAttribute("surfnet", lr.Left);
    elem.appendChild(ent2);

    var ent1 = document.createElement('a-entity');
    lr.Right['color'] = '#F00';
    surfaces.MoveSurface(lr.Right, new THREE.Vector4(0, 0, 0.05, 0))
    ent1.setAttribute("surfnet", lr.Right);
    elem.appendChild(ent1);

  </script>  
</body>

</html>
