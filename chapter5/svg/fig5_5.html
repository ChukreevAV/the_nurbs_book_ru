<!DOCTYPE html>
<html>

<head>
    <title>fig5_5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=AM_SVG"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.138.3/three.js"></script>
    <script src="../../js/lib/aframe/NURBSUtils.js"></script>
    <script src="../../js/lib/svg/svg.min.js"></script>
    <script src="../../js/lib/svg/svg.foreignobject.js"></script>
</head>

<body>
    <svg id="drawing"></svg>

    <script>
        var U = [0, 0, 0, 0, 2, 3, 3, 3, 3];
        var P = [
            new THREE.Vector2(40, 150),  //P0
            new THREE.Vector2(40, 90),  //P1
            new THREE.Vector2(140, 30),  //P2
            new THREE.Vector2(290, 80), //P3
            new THREE.Vector2(290, 150)  //P4
        ];

        var draw = SVG(document.getElementById('drawing')).size(400, 300);
        var stroke1 = { width: 1 }, stroke3 = { color: "black" };

        var sstring = "M", C;

        for (var i = 0; i < 5; i++) {
            draw.circle(6).move(P[i].x - 3, P[i].y - 3).fill('none').stroke(stroke1);
            sstring = sstring.concat(P[i].x, " ", P[i].y, " ");
        }

        draw.path(sstring).fill("none").stroke(stroke3);
        draw.path(NURBSUtils.DrawPath(3, U, P, 0, 3)).fill("none").stroke(stroke3);

        draw.foreignObject(80, 40).move(10, 125).appendChild("p", { innerText: "`P_0`" });
        draw.foreignObject(80, 40).move(10, 65).appendChild("p", { innerText: "`P_1`" });        
        draw.foreignObject(80, 40).move(130, -10).appendChild("p", { innerText: "`P_2`" });
        draw.foreignObject(80, 40).move(300, 55).appendChild("p", { innerText: "`P_3`" });        
        draw.foreignObject(80, 40).move(300, 125).appendChild("p", { innerText: "`P_4`" });

        draw.circle(4).move(40 - 2, 120 - 2).stroke(stroke1);//Q1_1
        draw.circle(4).move(73 - 2, 70 - 2).stroke(stroke1);//Q2_1
        draw.circle(4).move(190 - 2, 47 - 2).stroke(stroke1);//Q3_1
        draw.path("M40,120 73,70 190,47").fill("none").stroke(stroke3);
        draw.foreignObject(80, 40).move(10, 95).appendChild("p", { innerText: "`Q_{1,1}`" });
        draw.foreignObject(80, 40).move(40, 35).appendChild("p", { innerText: "`Q_{2,1}`" });
        draw.foreignObject(80, 40).move(175, 5).appendChild("p", { innerText: "`Q_{3,1}`" });

        draw.circle(4).move(57 - 2, 95 - 2).stroke(stroke1);//Q2_2
        draw.circle(4).move(112 - 2, 62 - 2).stroke(stroke1);//Q3_2
        draw.line(57, 95, 112, 62).stroke(stroke1);
        draw.foreignObject(80, 40).move(60, 80).appendChild("p", { innerText: "`Q_{2,2}`" });
        draw.foreignObject(80, 40).move(105, 50).appendChild("p", { innerText: "`Q_{3,2}`" });        

        draw.circle(4).move(84.5 - 2, 78.5 - 2).stroke(stroke1);//Q3_3
        draw.foreignObject(80, 40).move(80, 65).appendChild("p", { innerText: "`Q_{3,3}`" });    
        
        draw.line(30, 190, 360, 190).stroke(stroke1);
        draw.line(30, 185, 30, 195).stroke(stroke1);
        draw.line(35, 185, 35, 195).stroke(stroke1);
        draw.line(40, 185, 40, 195).stroke(stroke1);
        draw.line(45, 185, 45, 195).stroke(stroke1);      

        draw.line(245, 185, 245, 195).stroke(stroke1);  

        draw.line(345, 185, 345, 195).stroke(stroke1);
        draw.line(350, 185, 350, 195).stroke(stroke1);        
        draw.line(355, 185, 355, 195).stroke(stroke1);
        draw.line(360, 185, 360, 195).stroke(stroke1);

        var markerArrow = draw.marker(17, 7, function (add) { add.path("M1,6 L16,3.5 L1,1 L1,6").fill("white").stroke(stroke3); }).ref(16, 3.5);  
        draw.foreignObject(80, 40).move(140, 135).appendChild("p", { innerText: "`u`" });
        draw.line(145, 170, 145, 190).stroke(stroke1).marker("end", markerArrow);

        draw.path("M35,210 35,215 245,215 245,210").fill("none").stroke(stroke3);
        draw.path("M40,220 40,225 345,225 345,220").fill("none").stroke(stroke3);
        draw.path("M45,230 45,235 350,235 350,230").fill("none").stroke(stroke3);

        draw.circle(6).move(145 - 3, 215 - 3).fill('none').stroke(stroke1);
        draw.circle(6).move(145 - 3, 225 - 3).fill('none').stroke(stroke1);
        draw.circle(6).move(145 - 3, 235 - 3).fill('none').stroke(stroke1);

        draw.foreignObject(80, 40).move(360, 195).appendChild("p", { innerText: "`r=1`" });

        draw.path("M40,245 40,250 245,250 245,245").fill("none").stroke(stroke3);
        draw.path("M45,255 45,260 350,260 350,255").fill("none").stroke(stroke3);

        draw.circle(6).move(145 - 3, 250 - 3).fill('none').stroke(stroke1);
        draw.circle(6).move(145 - 3, 260 - 3).fill('none').stroke(stroke1);

        draw.foreignObject(80, 40).move(360, 225).appendChild("p", { innerText: "`r=2`" });

        draw.path("M45,270 45,275 245,275 245,270").fill("none").stroke(stroke3);

        draw.circle(6).move(145 - 3, 275 - 3).fill('none').stroke(stroke1);

        draw.foreignObject(80, 40).move(360, 245).appendChild("p", { innerText: "`r=3`" });

    </script>

</body>

</html>
