<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>img5_10a</title>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=AM_CHTML'></script>
  <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
  <script src="../../js/lib/aframe/aframe-environment-component.min.js"></script>
  <script src="../../js/lib/aframe/aframe-extras.min.js"></script>
  <script src="../../js/lib/aframe/aframe-html-shader.min.js"></script>
  <!--  -->
  <script src="../../js/aframe/xyz.js"></script>
  <script src="../../js/aframe/surfnet.js"></script>
  <script src="../../js/aframe/surflines.js"></script>
</head>

<body>
  <a-scene id="model" background="color: #FFFFFF">
    <a-light type="point" position="5 5 5"></a-light>
    <a-entity id="cameraRig" position="0 0 0.5" movement-controls="fly: true">
      <a-camera id="camera" look-controls></a-camera>
      <a-entity vive-controls="hand: left"></a-entity>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>
    <a-entity position="0 2 -3.5" rotation="25 -45 -25" axis-xyz>
      <a-entity tsphere></a-entity>
      <a-text side="double" position="-0.1 0 2.1" rotation="-15 45 0" value="y" color="black"></a-text>
      <a-text side="double" position="0 2 0" rotation="-15 45 0" value="z" color="black"></a-text>
      <a-text side="double" position="2 0 0" rotation="-15 45 0" value="x" color="black"></a-text>

      <a-entity surfnet="controlPoints: 
            0.3, 1.7, 0, 1,
            0.5, 1.7, 0, 1, 
            0.9, 1.5, 0, 1,
            1.2, 1.2, 0, 1,
            1.3, 1.2, 0, 1,

            0.3, 1.7, 0.8, 1, 
            0.5, 1.7, 0.8, 1, 
            0.9, 1.5, 0.8, 1,
            1.2, 1.2, 0.8, 1,
            1.3, 1.2, 0.8, 1,

            0.3, 1.2, 1.1, 1, 
            0.5, 1.2, 1.1, 1,             
            0.9, 1.1, 1.1, 1, 
            1.2, 0.9, 1.1, 1,             
            1.3, 0.9, 1.1, 1, 

            0.3, 1.2, 1.8, 1, 
            0.5, 1.2, 1.8, 1, 
            0.9, 1.1, 1.8, 1,
            1.2, 0.9, 1.8, 1,            
            1.3, 0.9, 1.8, 1;

            U: 0, 0, 0, 0, 1, 1, 1, 1;
            V: 0, 0, 0, 0.5, 1, 1, 1; 
            p: 3; q: 2; nx: 4; ny: 5;">
      </a-entity>

      <a-plane material="shader: html; target: #P00; ratio: height; transparent: true; side: double; fps: 25"
        position="0.1, 1.3, 1.7" rotation="-25 45 0" scale="0.3 0.3 1"></a-plane>

      <a-plane material="shader: html; target: #P01; ratio: height; transparent: true; side: double; fps: 25"
        position="0.2, 1.4, 1.2" rotation="-15 45 0" scale="0.3 0.3 1"></a-plane>

      <a-plane material="shader: html; target: #P03; ratio: height; transparent: true; side: double; fps: 25"
        position="0.3, 1.9, 0" rotation="-15 45 0" scale="0.3 0.3 1"></a-plane>

      <a-plane material="shader: html; target: #P10; ratio: height; transparent: true; side: double; fps: 25"
        position="0.9, 1.0, 1.9" rotation="-25 45 0" scale="0.3 0.3 1"></a-plane>

      <a-plane material="shader: html; target: #P30; ratio: height; transparent: true; side: double; fps: 25"
        position="1.2, 0.9, 1.85" rotation="-25 45 0" scale="0.3 0.3 1"></a-plane>            

      <a-plane material="shader: html; target: #P33; ratio: height; transparent: true; side: double; fps: 25"
        position="1.3, 1.5, 0" rotation="-15 45 0" scale="0.3 0.3 1"></a-plane>

    </a-entity>
  </a-scene>

  <div style="position: fixed; left: 0; top: 0; z-index: -1;">
    <div id="P00" style="font-size: 256px; padding-top: 12px; text-align: center; font-weight: 6;">
      <p style="border: 1px #FFF">`Q_{0,0}`</p>
    </div>
  </div>

  <div style="position: fixed; left: 0; top: 0; z-index: -1;">
    <div id="P01" style="font-size: 256px; padding-top: 12px; text-align: center; font-weight: 6;">
      <p style="border: 1px #FFF">`Q_{0,1}`</p>
    </div>
  </div>

  <div style="position: fixed; left: 0; top: 0; z-index: -1;">
    <div id="P03" style="font-size: 256px; padding-top: 12px; text-align: center; font-weight: 6;">
      <p style="border: 1px #FFF">`Q_{0,3}`</p>
    </div>
  </div>

  <div style="position: fixed; left: 0; top: 0; z-index: -1;">
    <div id="P10" style="font-size: 256px; padding-top: 12px; text-align: center; font-weight: 6;">
      <p style="border: 1px #FFF">`Q_{1,0}`</p>
    </div>
  </div>  

  <div style="position: fixed; left: 0; top: 0; z-index: -1;">
    <div id="P30" style="font-size: 256px; padding-top: 12px; text-align: center; font-weight: 6;">
      <p style="border: 1px #FFF">`Q_{4,0}`</p>
    </div>
  </div>

  <div style="position: fixed; left: 0; top: 0; z-index: -1;">
    <div id="P33" style="font-size: 256px; padding-top: 12px; text-align: center; font-weight: 6;">
      <p style="border: 1px #FFF">`Q_{4,3}`</p>
    </div>
  </div>     

</body>

</html>
