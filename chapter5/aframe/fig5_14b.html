<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>img5_14b</title>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=AM_CHTML'></script>
  <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
  <script src="../../js/lib/aframe/aframe-environment-component.min.js"></script>
  <script src="../../js/lib/aframe/aframe-extras.min.js"></script>
  <script src="../../js/lib/aframe/aframe-html-shader.min.js"></script>
  <script src="../../js/lib/aframe/NURBSUtils.js"></script>
  <!--  -->
  <script src="../../js/aframe/xyz.js"></script>
  <script src="../../js/aframe/surfaces.js"></script>
  <script src="surfnet.js"></script>
  <script src="test_surface.js"></script>  
</head>

<body>
  <a-scene id="model" background="color: #FFFFFF">
    <a-light type="point" position="5 5 5"></a-light>
    <a-entity id="cameraRig" position="0 0 0" movement-controls="fly: true">
      <a-camera id="camera" look-controls></a-camera>
      <a-entity vive-controls="hand: left"></a-entity>
      <a-entity laser-controls="hand: right"></a-entity>
    </a-entity>
    <a-entity id="sub_model" position="0 1.5 -3.5" rotation="25 -45 -25" axis-xyz>
      <a-text side="double" position="-0.1 0 2.1" rotation="-15 45 0" value="y" color="black"></a-text>
      <a-text side="double" position="0 2 0" rotation="-15 45 0" value="z" color="black"></a-text>
      <a-text side="double" position="2 0 0" rotation="-15 45 0" value="x" color="black"></a-text>

      <a-text side="double" position="1.5 0 1.5" rotation="-20 40 1.5" scale="0.5 0.5 1" value="(b)" color="black"></a-text>
    </a-entity>
  </a-scene>

  <script>
    var surf1 = test_surface.Create();
    var lr1 = surfaces.DivedeSurface(surf1, Direction.U_DIRECTION, 2/5);
    var lr11 = surfaces.DivedeSurface(lr1.Left, Direction.V_DIRECTION, 7/10);
    var lr12 = surfaces.DivedeSurface(lr1.Right, Direction.V_DIRECTION, 7/10);
    var elem = document.getElementById('sub_model');   

    var ent2 = document.createElement('a-entity');
    lr11.Left['draw_net'] = false;
    lr11.Left['draw_u'] = false;
    //lr11.Left['draw_v'] = false;    
    ent2.setAttribute("surfnet", lr11.Left);
    elem.appendChild(ent2);

    var ent1 = document.createElement('a-entity');
    lr11.Right['draw_net'] = false;
    //lr11.Right['draw_u'] = false;
    lr11.Right['draw_v'] = false;        
    surfaces.MoveSurface(lr11.Right, new THREE.Vector4(0, 0, 0.1, 0))
    ent1.setAttribute("surfnet", lr11.Right);
    elem.appendChild(ent1);

    var ent3 = document.createElement('a-entity');
    lr12.Left['draw_net'] = false;    
    //lr12.Left['draw_u'] = false;
    lr12.Left['draw_v'] = false;    
    surfaces.MoveSurface(lr12.Left, new THREE.Vector4(0.1, 0, 0, 0))    
    ent3.setAttribute("surfnet", lr12.Left);
    elem.appendChild(ent3);

    var ent4 = document.createElement('a-entity');
    lr12.Right['draw_net'] = false;    
    lr12.Right['draw_u'] = false;
    //lr12.Right['draw_v'] = false;        
    surfaces.MoveSurface(lr12.Right, new THREE.Vector4(0.1, 0, 0.1, 0))
    ent4.setAttribute("surfnet", lr12.Right);
    elem.appendChild(ent4);
  </script> 

</body>

</html>
