<!DOCTYPE html>

<body>
    <a-scene id="model" background="color: #FFFFFF">
        <a-assets>
            <a-mixin id="plane_material" material="shader: html; ratio: height; transparent: true; side: double; fps: 25"></a-mixin>
        </a-assets>

        <a-light type="point" position="5 5 5"></a-light>
        <a-entity id="cameraRig" position="0 0 0.5" movement-controls="fly: true">
            <a-camera id="camera" look-controls> </a-camera>
            <a-entity vive-controls="hand: left"></a-entity>
            <a-entity laser-controls="hand: right"></a-entity>
        </a-entity>

        <a-entity position="0 1 -3" rotation="25 -40 -15" axis-xyz>
            <a-text side="double" position="-0.1 0 2.1" rotation="-5 60 0" value="X" color="black"></a-text>
            <a-text side="double" position="0 2 0" rotation="-5 60 0" value="Z" color="black"></a-text>
            <a-text side="double" position="2 0 0" rotation="-5 60 0" value="Y" color="black"></a-text>

            <a-entity surfnet="controlPoints: 
                0.3, 1.8, 0, 1, 
                0.7, 2, 0, 1, 
                1.2, 1.5, 0, 1,
                0.3, 1.3, 0.7, 1, 
                0.7, 1.5, 0.7, 1, 
                1.2, 1, 0.7, 1,
                0.3, 1.7, 1.3, 1, 
                0.7, 1.9, 1.3, 1, 
                1.2, 1.4, 1.3, 1, 
                0.3, 1.2, 1.8, 1, 
                0.7, 1.4, 1.8, 1, 
                1.2, 0.9, 1.8, 1;
                U: 0, 0, 0, 1, 1, 1;  
                V: 0, 0, 0, 0, 1, 1, 1, 1; 
                p: 2; q: 3; nx: 4; ny: 3;">
            </a-entity>

            <a-entity surflines="controlPoints: 
                0.3, 1.8, 0, 1, 
                0.7, 2, 0, 1, 
                1.2, 1.5, 0, 1,
                0.3, 1.3, 0.7, 1, 
                0.7, 1.5, 0.7, 1, 
                1.2, 1, 0.7, 1,
                0.3, 1.7, 1.3, 5, 
                0.7, 1.9, 1.3, 1, 
                1.2, 1.4, 1.3, 1, 
                0.3, 1.2, 1.8, 1, 
                0.7, 1.4, 1.8, 1, 
                1.2, 0.9, 1.8, 1;
                U: 0, 0, 0, 0, 1, 1, 1, 1; 
                V: 0, 0, 0, 1, 1, 1; 
                p: 3; q: 2; nx: 4; ny: 3;">
            </a-entity>

            <a-plane mixin="plane_material" material="target: #P00"
                position="0.0, 1.3, 1.7" rotation="-15 30 0" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P01"
                position="0.0, 1.8, 1.2" rotation="-15 30 0" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #w05"
                position="0.0, 1.8, 1.6" rotation="-15 30 0" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P03"
                position="0.3, 2.0, 0" rotation="-15 30 0" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P20"
                position="1.35, 1.05, 1.7" rotation="-15 30 0" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P22"
                position="1.45, 1.3, 1.0" rotation="-15 30 0" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P23"
                position="1.3, 1.7, 0" rotation="-15 30 0" scale="0.3 0.3 1"></a-plane>

            <a-text side="double" position="1.4 0 1.0" rotation="-15 30 5" scale="0.8 0.8 1" value="(b)" color="black">
