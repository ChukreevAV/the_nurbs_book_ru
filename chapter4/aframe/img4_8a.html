<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>img4_8a</title>
    <link rel="stylesheet" href="../../css/a_img.css" />
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
    <script src="../../js/lib/aframe/aframe-environment-component.min.js"></script>
    <script src="../../js/lib/aframe/aframe-extras.min.js"></script>
    <script src="../../js/lib/aframe/aframe-html-shader.min.js"></script>
    <script src="../../js/lib/aframe/NURBSUtils.js"></script>
    <!--  -->
    <script src="../../js/aframe/xyz.js"></script>
    <script src="../../js/aframe/surfnet.js"></script>
</head>

<body>
    <a-scene id="model" background="color: #FFFFFF">
        <a-assets>
            <a-mixin id="plane_material" material="shader: html; ratio: height; transparent: true; side: double; fps: 25"></a-mixin>
        </a-assets>

        <a-light type="point" position="5 5 5"></a-light>
        <a-entity id="cameraRig" position="0 0 0.5" movement-controls="fly: true">
            <a-camera id="camera" look-controls> </a-camera>
            <a-entity vive-controls="hand: left"></a-entity>
            <a-entity laser-controls="hand: right"></a-entity>
        </a-entity>

        <a-entity position="0 1 -3" rotation="25 -40 -15" axis-xyz>
            <a-text side="double" position="-0.1 0 2.1" rotation="-5 60 0" value="X" color="black"></a-text>
            <a-text side="double" position="0 2 0" rotation="-5 60 0" value="Z" color="black"></a-text>
            <a-text side="double" position="2 0 0" rotation="-5 60 0" value="Y" color="black"></a-text>

            <a-entity surfnet="controlPoints: 
                0.3, 1.9, 0, 1, 
                0.6, 1.9, 0, 1, 
                0.8, 1.5, 0, 1, 
                1.1, 1.5, 0, 1,
                1.3, 1.7, 0, 1,

                0.3, 1.7, 0, 1, 
                0.6, 1.7, 0, 1, 
                0.8, 1.3, 0, 1, 
                1.1, 1.3, 0, 1,
                1.3, 1.5, 0, 1, 

                0.3, 1.7, 0.8, 1, 
                0.6, 1.7, 0.8, 10, 
                0.8, 1.3, 0.8, 10, 
                1.1, 1.3, 0.8, 1,
                1.3, 1.5, 0.8, 1,

                0.3, 1.3, 1, 1, 
                0.6, 1.3, 1, 10, 
                0.8, 0.9, 1, 10, 
                1.1, 0.9, 1, 1,
                1.3, 1.1, 1, 1,

                0.3, 1.3, 1.5, 1, 
                0.6, 1.3, 1.5, 1, 
                0.8, 0.9, 1.5, 1, 
                1.1, 0.9, 1.5, 1,
                1.3, 1.1, 1.5, 1;

                U: 0, 0, 0, 0.333, 0.666, 1, 1, 1; 
                V: 0, 0, 0, 0.333, 0.666, 1, 1, 1;
                p: 2; q: 2; nx: 5; ny: 5;">
            </a-entity>

            <a-plane mixin="plane_material" material="target: #P00"
                position="0.0, 1.1, 1.5" rotation="-5 45 5" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P01"
                position="0.0, 1.5, 0.9" rotation="-5 45 5" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P04"
                position="0.4, 2.1, 0.1" rotation="-5 45 5" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P10"
                position="0.5, 1.1, 1.5" rotation="-5 45 5" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P40"
                position="0.9, 0, 0.9" rotation="-25 45 5" scale="0.3 0.3 1"></a-plane>

            <a-plane mixin="plane_material" material="target: #P44"
                position="1.4, 1.9, 0" rotation="-5 45 5" scale="0.3 0.3 1"></a-plane>

            <a-text side="double" position="1.1 0 1.1" rotation="-5 35 5" scale="0.8 0.8 1" value="(a)" color="black">

        </a-entity>
    </a-scene>

    <div class="parent">
        <div id="P00" class="text_baner">
            <p style="border: 1px #FFF">$$P_{0,0}$$</p>
        </div>
    </div>

    <div class="parent">
        <div id="P01" class="text_baner">
            <p style="border: 1px #FFF">$$P_{0,1}$$</p>
        </div>
    </div>

    <div class="parent">
        <div id="P04" class="text_baner">
            <p style="border: 1px #FFF">$$P_{0,4}$$</p>
        </div>
    </div>

    <div class="parent">
        <div id="P10" class="text_baner">
            <p style="border: 1px #FFF">$$P_{1,0}$$</p>
        </div>
    </div>

    <div class="parent">
        <div id="P40" class="text_baner">
            <p style="border: 1px #FFF">$$P_{4,0}$$</p>
        </div>
    </div>

    <div class="parent">
        <div id="P44" class="text_baner">
            <p style="border: 1px #FFF">$$P_{4,4}$$</p>
        </div>
    </div>

</body>

</html>
