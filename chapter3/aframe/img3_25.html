<!DOCTYPE html>
<html>

<head>

<body>
    <a-scene id="model" background="color: #FFFFFF">
        <a-assets>
            <a-mixin id="plane_material" material="shader: html; ratio: height; transparent: true; side: double; fps: 25"></a-mixin>
        </a-assets>

        <a-light type="point" position="5 5 5"></a-light>
        <a-entity id="cameraRig" position="0 0 0.5" movement-controls="fly: true">

            <a-entity vive-controls="hand: left"></a-entity>
            <a-entity laser-controls="hand: right"></a-entity>
        </a-entity>

        <a-entity position="0 2 -3.5" rotation="25 -50 -30" axis-xyz>
            <a-text side="double" position="-0.1 0 2.1" rotation="-5 60 0" value="X" color="black"></a-text>
            <a-text side="double" position="0 2 0" rotation="-5 60 0" value="Z" color="black"></a-text>
            <a-text side="double" position="2 0 0" rotation="-5 60 0" value="Y" color="black"></a-text>

            <a-entity surfnet="controlPoints: 
                0.0, 1.2, 2, 1, 
                0.5, 0.8, 2, 1, 
                1, 1.3, 2, 1, 
                1, 1.3, 2, 1, 
                1, 1.3, 2, 1, 
                1.5, 0.8, 2, 1, 
                2, 1.2, 2, 1,

                1, 1.1, 0.5, 1,

                1, 1.1, 0.5, 1, 
                1.5, 0.5, 0.5, 1, 
                2, 1, 0.5, 1,

                0.0, 1.2, 0, 1, 
                0.5, 0.8, 0, 1, 
                1, 1.3, 0, 1, 
                1, 1.3, 0, 1, 
                1, 1.3, 0, 1, 
                1.5, 0.8, 0, 1, 
                2, 1.2, 0, 1;

                U: 0, 0, 0, 0, 0.25, 0.5, 0.75, 1, 1, 1, 1;  
                V: 0, 0, 0, 0, 0.5, 1, 1, 1, 1; 
                p: 3; q: 3; nx: 5; ny: 7;">
            </a-entity>

            <a-entity surflines="controlPoints: 
                0.0, 1.2, 2, 1, 
                0.5, 0.8, 2, 1, 
                1, 1.3, 2, 1, 
                1, 1.3, 2, 1, 
                1, 1.3, 2, 1, 
                1.5, 0.8, 2, 1, 
                2, 1.2, 2, 1,

                0.0, 1, 1.5, 1, 
                0.5, 0.5, 1.5, 1, 
                1, 1.1, 1.5, 1,

                p: 3; q: 3; nx: 5; ny: 7;">

                <a-plane mixin="plane_material" material="target: #P00"
                    position="0, 1.45, 2" rotation="-15 45 5" scale="0.3 0.3 1"></a-plane>

                <a-plane mixin="plane_material" material="target: #P02"                
                    position="0, 1.2, 1" rotation="-15 45 5" scale="0.3 0.3 1"></a-plane>

                <a-plane mixin="plane_material" material="target: #P04"
                    position="0, 1.45, 0" rotation="-15 45 5" scale="0.3 0.3 1"></a-plane>

                <a-plane mixin="plane_material" material="target: #P10"
                    position="0.5, 0.8, 2" rotation="-15 45 5" scale="0.3 0.3 1"></a-plane>

                <a-plane mixin="plane_material" material="target: #P24"
                    position="0.8, 1.45, -0.2" rotation="-15 45 5" scale="0.3 0.3 1"></a-plane>

                <a-plane mixin="plane_material" material="target: #P50"
                    position="1.7, 1.1, 2.2" rotation="-15 45 5" scale="0.3 0.3 1"></a-plane>

                <a-plane mixin="plane_material" material="target: #P60"
                    position="2, 1.1, 2" rotation="-25 45 5" scale="0.3 0.3 1"></a-plane>

                <a-plane mixin="plane_material" material="target: #P64"
                    position="2, 1.4, 0" rotation="-25 45 5" scale="0.3 0.3 1"></a-plane>

            </a-entity>
        </a-entity>

        <div id="P00" class="text_baner">
            <p style="border: 1px #FFF">$$P_{0,0}$$</p>
